name: PWA browser boot
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pwa-browsers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boot:
    name: PWA / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build:launcher && npm run build:content
      - run: node tests/test-app-shell-client.mjs && node tests/test-app-shell-worker-update-status.mjs
      - run: node tests/runtime-cache-cases.mjs && node tests/shell-handoff-cases.mjs
      - run: python tests/browser/runtime-recovery-cases.py --browser=${{ matrix.browser }}
      - run: python tests/browser/test-pwa-boot.py --browser=${{ matrix.browser }}
